name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Pushes, PRs, and fork PRs only ever read the repository. The release job
# widens its own scope below.
permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift build
        run: swift build

      - name: Swift tests
        run: swift test

      - name: Install TypeScript toolchain
        run: npm install --no-audit --no-fund

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run extension tests
        run: node tests/extension.test.mjs

      - name: Build script syntax check
        run: bash -n build.sh

      # The real script, not just a syntax check: a broken step used to first
      # surface inside the release job.
      - name: Build app bundle
        run: ./build.sh

      # The app refuses to install its Pi extension unless this seal holds, and
      # it fails closed. A build step that touches the bundle after signing must
      # fail here, not silently disable the extension for every user.
      - name: Verify the app bundle still matches its signature
        run: codesign --verify --deep --strict "build/Pi Status Bar.app"

      - name: Verify required files exist
        run: |
          test -f extensions/pi-statusbar.ts
          test -f Package.swift
          test -f Sources/PiStatusBar/main.swift
          test -f Sources/PiStatusBarKit/App.swift
          test -f Sources/PiStatusBarKit/SessionRules.swift
          test -f tests/PiStatusBarKitTests/CuePlayerTests.swift
          test -f tests/PiStatusBarKitTests/SessionRulesTests.swift
          test -f tests/extension.test.mjs
          test -f tools/AppIcon/main.swift
          test -f images/app-icon.svg
          test -f images/pi.png
          test -f build.sh
          test -f README.md
