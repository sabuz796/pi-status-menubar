name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift syntax check
        run: swiftc -typecheck Sources/*.swift Sources/Dashboard/*.swift -framework Cocoa

      - name: Cue rule tests
        run: |
          swiftc -O Sources/Sounds.swift tests/cues/main.swift -o /tmp/cues
          /tmp/cues

      - name: Install TypeScript toolchain
        run: npm install --no-audit --no-fund

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run extension tests
        run: node tests/extension.test.mjs

      - name: Build script syntax check
        run: bash -n build.sh

      - name: Verify required files exist
        run: |
          test -f extensions/pi-statusbar.ts
          test -f Sources/main.swift
          test -f Sources/Sounds.swift
          test -f tests/cues/main.swift
          test -f tools/AppIcon/main.swift
          test -f images/app-icon.svg
          test -f images/pi.png
          test -f build.sh
          test -f README.md
